<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8326a">
<title>MKW</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="variables.css?v=0.6.0">
<link rel="stylesheet" href="global.css?v=0.6.0">
<link rel="stylesheet" href="auth.css?v=0.6.0">
<link rel="stylesheet" href="search.css?v=0.6.0">
<link rel="stylesheet" href="library.css?v=0.6.0">
<link rel="stylesheet" href="player.css?v=0.6.0">
<link rel="stylesheet" href="polish.css?v=0.6.0">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14.500 5.200l4.200 14.600"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path class="f" fill="currentColor" stroke="none" d="M7 4.500v15l12-7.500z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.500" width="4" height="15" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4.500" width="4" height="15" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5v14l9-7z" fill="currentColor" stroke="none"/><rect x="16.500" y="5" width="2.500" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5v14l-9-7z" fill="currentColor" stroke="none"/><rect x="5" y="5" width="2.500" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.500c5 0 6 10 11 10H21M3 17h3.500c1.800 0 3-1.200 4-2.800M13.500 9.200C14.700 7.800 16 7 17.500 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3M11 10l1.500-1v6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.500s-8-4.800-8-10.500A4.500 4.500 0 0 1 12 7.300 4.500 4.500 0 0 1 20 10c0 5.700-8 10.500-8 10.500z"/></symbol>
  <symbol id="i-heart-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.500s-8-4.800-8-10.500A4.500 4.500 0 0 1 12 7.300 4.500 4.500 0 0 1 20 10c0 5.700-8 10.500-8 10.500z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.800" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.800" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.800" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h7"/><path d="M16 14v6l5-3z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.400 1.400M17.600 17.600L19 19M5 19l1.400-1.400M17.600 6.400L19 5"/></symbol>
  <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="17.500" cy="16" r="2.500"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.500 1.500M9 2h6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-dislike" viewBox="0 0 24 24"><path d="M10 15H5.5a2 2 0 0 1-2-2.3l1-6A2 2 0 0 1 6.5 5H17v10l-4 6a2 2 0 0 1-3-2.2z"/><path d="M17 5h3v10h-3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next-up" viewBox="0 0 24 24"><path d="M4 7h10M4 12h10M4 17h6M18 8v8M15 13l3 3 3-3"/></symbol>
</svg>

<!-- ===== Вход ===== -->
<section id="auth-screen" hidden>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="auth-card">
    <img class="auth-logo" src="logo.png" alt="">
    <h1 class="auth-title">MKW</h1>
    <p class="auth-sub">Музыка для своих</p>
    <div class="seg" id="auth-tabs">
      <button type="button" data-mode="login" class="active">Вход</button>
      <button type="button" data-mode="register">Регистрация</button>
    </div>
    <form id="auth-form" autocomplete="on" novalidate>
      <label class="field"><span>Ник (латиница и цифры, 3–20)</span>
        <input id="auth-nick" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"></label>
      <label class="field"><span>Пароль (от 6 символов)</span>
        <input id="auth-pass" type="password" autocomplete="current-password" maxlength="64"></label>
      <p class="auth-error" id="auth-error" role="alert"></p>
      <button class="btn block" id="auth-submit" type="submit">Войти</button>
    </form>
    <p class="auth-hint">Почта не нужна. Забыли пароль — напишите админу.</p>
  </div>
</section>

<!-- ===== Приложение ===== -->
<div id="app" hidden>
  <main>
    <section class="view" id="view-search">
      <div class="hello"><p class="hello-sub" id="search-hello"></p><h1 class="view-title">Что послушаем?</h1></div>
      <button class="wave-btn" id="wave-btn" type="button"><span class="wave-ico"><svg class="icon"><use href="#i-play"/></svg></span><span class="wave-txt"><b>Моя волна</b><small id="wave-sub">Музыка под ваш вкус, подстраивается на лету</small></span></button>
      <form class="search-form" id="search-form" role="search">
        <svg class="icon lead"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Трек или исполнитель" autocomplete="off" enterkeyhint="search">
        <button class="icon-btn" id="search-clear" type="button" aria-label="Очистить" hidden><svg class="icon"><use href="#i-close"/></svg></button>
      </form>
      <div class="search-chips" id="search-history"></div>
      <div class="search-status" id="search-status"></div>
      <div id="search-recs"></div>
      <div class="list" id="search-results"></div>
      <div id="search-more" style="text-align:center;margin:16px 0"></div>
    </section>

    <section class="view" id="view-library" hidden>
      <h1 class="view-title">Библиотека</h1>
      <div class="lib-tabs" id="lib-tabs">
        <button class="chip active" data-tab="likes" type="button">Лайки</button>
        <button class="chip" data-tab="playlists" type="button">Плейлисты</button>
        <button class="chip" data-tab="history" type="button">История</button>
      </div>
      <div id="lib-content"></div>
    </section>

    <section class="view" id="view-profile" hidden></section>
  </main>

  <div id="dock">
  <!-- Мини-плеер -->
  <div id="mini-player" hidden>
    <button id="mini-open" type="button" aria-label="Открыть плеер">
      <div id="mini-art"></div>
      <div class="track-info"><div class="track-title" id="mini-title"></div><div class="track-sub" id="mini-artist"></div></div>
    </button>
    <button class="icon-btn" id="mini-toggle" type="button" aria-label="Пауза/играть"><svg class="icon"><use href="#i-play"/></svg></button>
    <button class="icon-btn" id="mini-next" type="button" aria-label="Следующий"><svg class="icon"><use href="#i-next"/></svg></button>
    <div id="mini-progress"></div>
  </div>

  <nav id="bottom-nav"><div class="nav-inner">
    <button class="nav-btn active" data-view="search" type="button"><span class="pill"><svg class="icon"><use href="#i-search"/></svg></span>Поиск</button>
    <button class="nav-btn" data-view="library" type="button"><span class="pill"><svg class="icon"><use href="#i-library"/></svg></span>Библиотека</button>
    <button class="nav-btn" data-view="profile" type="button"><span class="pill"><svg class="icon"><use href="#i-user"/></svg></span>Профиль</button>
  </div></nav>
  </div>
</div>

<!-- Большой плеер -->
<section id="full-player" aria-label="Плеер">
  <div id="fp-bg" aria-hidden="true"></div>
  <div id="fp-glow" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="fp-inner">
    <div class="fp-top">
      <button class="icon-btn" id="fp-close" type="button" aria-label="Свернуть"><svg class="icon"><use href="#i-chevron-down"/></svg></button>
      <span class="fp-badge" id="fp-badge"></span>
      <button class="icon-btn" id="fp-more" type="button" aria-label="Ещё"><svg class="icon"><use href="#i-more"/></svg></button>
    </div>
    <div class="fp-wave-title" aria-hidden="true">Моя волна</div>
    <div id="fp-art"></div>
    <div class="fp-meta">
      <div class="txt"><div id="fp-title"></div><button type="button" id="fp-artist"></button></div>
      <button class="icon-btn" id="fp-dislike" type="button" aria-label="Не нравится" hidden><svg class="icon"><use href="#i-dislike"/></svg></button>
      <button class="icon-btn" id="fp-like" type="button" aria-label="Лайк"><svg class="icon"><use href="#i-heart"/></svg></button>
    </div>
    <div class="fp-seek">
      <input id="fp-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
      <div class="fp-times"><span id="fp-cur">0:00</span><span id="fp-dur">0:00</span></div>
    </div>
    <div class="fp-controls">
      <button class="icon-btn" id="fp-shuffle" type="button" aria-label="Перемешать"><svg class="icon"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn" id="fp-prev" type="button" aria-label="Назад"><svg class="icon"><use href="#i-prev"/></svg></button>
      <button class="fp-play" id="fp-toggle" type="button" aria-label="Пауза/играть"><svg class="icon"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="fp-next" type="button" aria-label="Вперёд"><svg class="icon"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="fp-repeat" type="button" aria-label="Повтор"><svg class="icon"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="fp-extra">
      <button class="icon-btn" id="fp-queue" type="button" aria-label="Очередь"><svg class="icon"><use href="#i-queue"/></svg></button>
      <button class="icon-btn" id="fp-sleep" type="button" aria-label="Таймер сна"><svg class="icon"><use href="#i-timer"/></svg></button>
    </div>
    <div class="fp-note" id="fp-note"></div>
  </div>
</section>

<section id="artist-page" aria-label="Исполнитель">
  <div class="artist-inner">
    <button class="icon-btn" id="artist-back" type="button" aria-label="Назад"><svg class="icon"><use href="#i-back"/></svg></button>
    <div id="artist-body"></div>
  </div>
</section>

<div id="sheet-overlay"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<audio id="preview-player" preload="none"></audio>
<div id="yt-holder" style="position:fixed;width:1px;height:1px;left:-10px;top:-10px;overflow:hidden;opacity:0;pointer-events:none"><div id="yt-target"></div></div>

<script type="module" src="app.js?v=0.6.0"></script>
</body>
</html>
