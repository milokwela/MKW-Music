<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050508">
<title>MKW Music — технический перерыв</title>
<link rel="icon" href="mkw-favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(90% 60% at 50% 0%, rgba(255,60,90,.22), transparent 70%), radial-gradient(70% 50% at 100% 100%, rgba(122,92,255,.18), transparent 70%), #050508; color: #f3f3f7; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; overflow: hidden; }
  .card { width: min(440px, 100%); padding: 34px 24px 28px; border-radius: 30px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 30px 80px rgba(0,0,0,.6); animation: in .6s cubic-bezier(.2,.9,.3,1.05) both; }
  .logo { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 24px; display: block; box-shadow: 0 10px 40px rgba(255,60,90,.35); animation: pulse 2.4s ease-in-out infinite; }
  .brand { font-weight: 900; font-size: 30px; letter-spacing: .04em; margin: 0; }
  .tag { display: inline-block; margin: 10px 0 18px; padding: 5px 14px; border-radius: 999px; background: rgba(255,59,48,.16); color: #ff8a80; font-weight: 800; font-size: 13px; letter-spacing: .03em; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0 0 10px; color: rgba(255,255,255,.75); }
  .note { margin-top: 18px; font-size: 13px; color: rgba(255,255,255,.5); }
  .dots { display: inline-flex; gap: 6px; margin-top: 14px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b5c; animation: dot 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes in { from { opacity: 0; transform: translateY(20px) scale(.97); } }
  @keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 10px 56px rgba(255,60,90,.55); } }
  @keyframes dot { 50% { opacity: .25; transform: translateY(-4px); } }
</style>
</head>
<body>
  <main class="card" role="alert">
    <img class="logo" src="mkw-512.png" alt="MKW">
    <p class="brand">MKW</p>
    <span class="tag">ТЕХНИЧЕСКИЙ ПЕРЕРЫВ</span>
    <h1>Упс! Мы нашли критическую ошибку</h1>
    <p>Прямо сейчас срочно её исправляем. Пока MKW Music недоступен.</p>
    <p>Мы пришлём уведомление, когда работа возобновится — у всех сразу.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="note">Ваш профиль, лайки, плейлисты и чаты в сохранности.</p>
  </main>
<script>
  // как только перерыв закончится — страница сама откроет MKW Music
  setInterval(function () {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.v && j.v !== 'maintenance') location.reload(); }).catch(function () {});
  }, 30000);
</script>
</body>
</html>
