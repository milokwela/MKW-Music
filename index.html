<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>MKW Music</title>
<link rel="icon" href="mkw-favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-content: center; justify-items: center; gap: 34px; padding: 24px; color: #fff; font: 600 20px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; overflow: hidden; }
  .logo { position: relative; width: 120px; height: 120px; animation: float 3.2s ease-in-out infinite; }
  .logo img { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 32px; display: block; animation: spin 6s cubic-bezier(.6,0,.4,1) infinite; }
  .logo::before { content: ''; position: absolute; inset: -14px; border-radius: 44px; background: conic-gradient(from 0deg, #ff3b5c, #7a5cff, #39f3ff, #ff3b5c); filter: blur(22px); opacity: .55; animation: glow 4s linear infinite; }
  .logo::after { content: ''; position: absolute; inset: -8px; border-radius: 40px; border: 2px solid rgba(255,255,255,.18); animation: ring 2.4s ease-out infinite; }
  p { margin: 0; letter-spacing: .01em; }
  small { display: block; margin-top: 8px; font-size: 15px; font-weight: 500; color: rgba(255,255,255,.55); }
  small i { display: inline-block; animation: dot 1.4s infinite; font-style: normal; }
  small i:nth-child(2) { animation-delay: .2s; } small i:nth-child(3) { animation-delay: .4s; }
  @keyframes float { 50% { transform: translateY(-10px); } }
  @keyframes spin { 0%, 60% { transform: rotateY(0) scale(1); } 75% { transform: rotateY(180deg) scale(1.06); } 90%, 100% { transform: rotateY(360deg) scale(1); } }
  @keyframes glow { to { transform: rotate(360deg); } }
  @keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  @keyframes dot { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div class="logo"><img src="mkw-512.png" alt="MKW"></div>
  <p>Сайт на модерации Google<small>Ожидайте<i>.</i><i>.</i><i>.</i></small></p>
<script>
  setInterval(function () {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.v && j.v !== 'maintenance') location.reload(); }).catch(function () {});
  }, 30000);
</script>
</body>
</html>
