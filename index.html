<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a2e">
<title>MILOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root{
  --primary:#ffb3a7; --on-primary:#5c1100;
  --primary-container:#8a2a1e; --on-primary-container:#ffdad3;
  --secondary:#a8d5a2; --secondary-container:#1f4a2a; --on-secondary-container:#c4f0bb;
  --tertiary:#ffd977; --accent:#ff6b6b; --mint:#8fe3c0;
  --surface:#11140f; --surface-low:#191d16; --surface-container:#1e241b;
  --surface-high:#2a3327; --on-surface:#eef2e8; --on-surface-variant:#c3cbb9;
  --outline:#8a9583; --error:#ffb4ab; --error-container:#5c1d1d;
  --shape-lg:28px; --shape-xl:32px;
}
body{background:linear-gradient(-45deg,#11140f,#1d1412,#0f2016,#241410)!important;background-size:400% 400%}
header::before{
  content:"";position:absolute;left:0;right:0;top:0;height:14px;
  background:radial-gradient(circle at 10px 6px,#ff6b6b 4px,transparent 5px) repeat-x;
  background-size:44px 14px;opacity:.9;pointer-events:none;
}
header{position:relative;overflow:hidden}
.msg.user{background:linear-gradient(135deg,#8a2a1e,#2c5a34)!important;color:var(--on-primary-container)}
.msg.ai{border-radius:28px 28px 28px 10px}
.msg.user{border-radius:28px 28px 10px 28px}
.logo{border-radius:20px!important;background:linear-gradient(135deg,#ff6b6b,#ffd977,#8fe3c0)!important;animation:glow 3s ease-in-out infinite}
#send{background:linear-gradient(135deg,#ffd977,#ff6b6b)!important}
.btn{background:linear-gradient(135deg,#ffd977,#ff6b6b)!important}
.sheet{border-radius:var(--shape-xl)!important}
.btn.text{background:transparent!important;color:var(--tertiary)!important}
.btn.danger{background:transparent!important;color:var(--error)!important}
:root{
  --primary:#ffffff; --on-primary:#000000;
  --primary-container:#2b2b2b; --on-primary-container:#ffffff;
  --secondary:#d9d9d9; --tertiary:#ffffff;
  --surface:#000000; --surface-low:#0d0d0d; --surface-container:#141414;
  --surface-high:#1f1f1f; --on-surface:#ffffff; --on-surface-variant:#bdbdbd;
  --outline:#6b6b6b;
}
body{background:linear-gradient(-45deg,#000000,#101010,#1a1a1a,#050505)!important;background-size:400% 400%}
header{background:rgba(13,13,13,.85)!important;border-bottom:1px solid rgba(255,255,255,.1)!important}
header::before{background:radial-gradient(circle at 10px 6px,#ffffff 4px,transparent 5px) repeat-x!important}
.logo{background:linear-gradient(135deg,#ffffff,#bdbdbd)!important;color:#000!important;box-shadow:0 0 18px rgba(255,255,255,.35)!important}
.msg.user{background:linear-gradient(135deg,#ffffff,#cfcfcf)!important;color:#000!important}
.msg.ai{background:#1f1f1f!important;border:1px solid rgba(255,255,255,.08)!important}
.msg.error{background:#2a0000!important;color:#ffb4b4!important}
#send,.btn{background:#ffffff!important;color:#000!important;box-shadow:none!important}
#bar{background:rgba(13,13,13,.9)!important;border-top:1px solid rgba(255,255,255,.1)!important}
.row{background:#1f1f1f!important}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Roboto,system-ui,sans-serif;color:var(--on-surface);
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(-45deg,#0f1a2e,#1b2b4f,#2a1f3d,#0f2a2a);
  background-size:400% 400%;animation:bgshift 18s ease infinite;
}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.material-icons-round{font-family:'Material Icons Round';font-size:24px;line-height:1;user-select:none}
.ui{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;min-height:0}

/* top app bar */
header{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(22,35,59,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.logo{
  width:44px;height:44px;border-radius:16px;position:relative;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--primary));color:#2a1400;
  box-shadow:0 0 18px rgba(255,210,122,.45);animation:glow 2.4s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 12px rgba(255,210,122,.35)}50%{box-shadow:0 0 26px rgba(255,107,107,.55)}}
header h1{font-size:22px;font-weight:700;flex:1;letter-spacing:.5px}
header h1 span{background:linear-gradient(90deg,var(--primary),var(--accent),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
header small{display:block;font-size:12px;color:var(--on-surface-variant);font-weight:400;letter-spacing:0}

.icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;background:transparent;
  color:var(--on-surface-variant);cursor:pointer;display:grid;place-items:center;flex-shrink:0;
  transition:background .2s,transform .15s;
}
.icon-btn:active{background:var(--surface-high);transform:scale(.94)}

/* chat */
#chat{
  flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.msg{
  max-width:86%;padding:12px 16px;border-radius:22px;line-height:1.5;
  white-space:pre-wrap;word-wrap:break-word;animation:pop .3s cubic-bezier(.2,.8,.2,1);font-size:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary-container),#5a2a4a);color:var(--on-primary-container);border-bottom-right-radius:8px}
.msg.ai{align-self:flex-start;background:var(--surface-high);border-bottom-left-radius:8px;border:1px solid rgba(255,255,255,.05)}
.msg.error{align-self:flex-start;background:var(--error-container);color:var(--error);border-bottom-left-radius:8px}
.msg.typing div{display:flex;gap:5px;padding:4px 0}
.msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:dot 1.2s infinite ease-in-out}
.msg.typing i:nth-child(2){animation-delay:.2s}.msg.typing i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.msg img{display:block;max-width:100%;max-height:280px;border-radius:16px;margin-bottom:8px;object-fit:cover}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}

.empty{margin:auto;text-align:center;color:var(--on-surface-variant);padding:24px;animation:float 3s ease-in-out infinite}
.empty .material-icons-round{font-size:60px;color:var(--primary);margin-bottom:10px;filter:drop-shadow(0 0 12px rgba(255,210,122,.5))}
.empty h2{font-size:22px;font-weight:700;color:var(--on-surface);margin-bottom:6px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* input bar */
#bar{
  background:rgba(22,35,59,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:10px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(255,255,255,.06);
}
#preview{display:none;align-items:center;gap:10px;padding:0 6px}
#preview img{height:56px;width:56px;border-radius:14px;object-fit:cover}
#preview span{font-size:13px;color:var(--on-surface-variant);flex:1}
.row{
  display:flex;align-items:flex-end;gap:4px;background:var(--surface-high);
  border-radius:30px;padding:6px;border:1px solid rgba(255,255,255,.06);
  transition:box-shadow .2s;
}
.row:focus-within{box-shadow:0 0 0 2px rgba(255,210,122,.35)}
textarea{
  flex:1;background:transparent;border:none;outline:none;color:inherit;font:inherit;
  font-size:15px;resize:none;max-height:140px;padding:11px 8px;line-height:1.4;
}
textarea::placeholder{color:var(--outline)}
#send{background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--on-primary);box-shadow:0 4px 14px rgba(255,107,107,.35)}
#send:disabled{opacity:.35;box-shadow:none}

/* settings */
#settings{
  position:fixed;inset:0;background:rgba(5,10,20,.6);backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:10;
}
#settings.open{display:flex}
.sheet{
  background:var(--surface-container);border-radius:28px;padding:24px;width:100%;
  max-width:420px;display:flex;flex-direction:column;gap:16px;animation:pop .3s ease;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.sheet h2{font-size:22px;font-weight:700}
.sheet p{font-size:13px;color:var(--on-surface-variant);line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--primary);letter-spacing:.3px}
.field input{
  background:var(--surface-high);border:1px solid var(--outline);border-radius:14px;
  padding:14px;color:inherit;font:inherit;font-size:14px;outline:none;
}
.field input:focus{border-color:var(--primary)}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.btn{
  padding:10px 20px;border-radius:20px;border:none;background:linear-gradient(135deg,var(--primary),var(--accent));
  color:var(--on-primary);font:inherit;font-weight:700;cursor:pointer;font-size:14px;
}
.btn.text{background:transparent;color:var(--primary)}
.btn.danger{background:transparent;color:var(--error);margin-right:auto}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="ui">
  <header>
    <div class="logo"><span class="material-icons-round">auto_awesome</span></div>
    <h1><span>MILOK</span><small id="modelLabel"></small></h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Настройки"><span class="material-icons-round">tune</span></button>
  </header>

  <main id="chat">
    <div class="empty" id="emptyState">
      <span style="font-size:64px;line-height:1;display:block;margin-bottom:10px">⛄</span>
      <h2>С Новым годом!</h2>
      <p>Задай вопрос или прикрепи картинку</p>
    </div>
  </main>

  <footer id="bar">
    <div id="preview">
      <img id="previewImg" alt="">
      <span>Картинка прикреплена</span>
      <button class="icon-btn" id="removeImg" aria-label="Убрать картинку"><span class="material-icons-round">close</span></button>
    </div>
    <div class="row">
      <button class="icon-btn" id="attach" aria-label="Прикрепить фото"><span class="material-icons-round">add_photo_alternate</span></button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="input" rows="1" placeholder="Сообщение"></textarea>
      <button class="icon-btn" id="send" aria-label="Отправить"><span class="material-icons-round">send</span></button>
    </div>
  </footer>
</div>

<div id="settings">
  <div class="sheet">
    <h2>Настройки</h2>
    <p>Ключ хранится только в этом браузере и отправляется только на указанный ниже адрес API.</p>
    <div class="field">
      <label for="k">API-ключ</label>
      <input id="k" type="password" placeholder="sk-star-..." autocomplete="off">
    </div>
    <div class="field">
      <label for="m">Модель</label>
      <input id="m" type="text" placeholder="gemini-2.0-flash">
    </div>
    <p>Название модели смотри на сайте ai.starimg.ru в разделе «Доступные модели» и впиши его точно так же.</p>
    <div class="field">
      <label for="u">Адрес API</label>
      <input id="u" type="text" placeholder="https://ai.starimg.ru/v1/chat/completions">
    </div>
    <div class="actions">
      <button class="btn danger" id="clearBtn">Очистить чат</button>
      <button class="btn text" id="cancelBtn">Отмена</button>
      <button class="btn" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
const SYSTEM = 'Ты MILOK — дружелюбный ИИ-ассистент. Отвечай на языке пользователя, понятно и по делу.';
const DEFAULT_MODEL = 'gemini-2.0-flash';
const DEFAULT_URL = 'https://ai.starimg.ru/v1/chat/completions';
const KEY_STORE = 'milok_key2', MODEL_STORE = 'milok_model2', URL_STORE = 'milok_url2';

const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};

let apiKey = store.get(KEY_STORE, '');
let model = store.get(MODEL_STORE, DEFAULT_MODEL);
let apiUrl = store.get(URL_STORE, DEFAULT_URL);
let history = [];
let pendingImage = null;

const $ = s => document.querySelector(s);
const chat = $('#chat');

function updateLabel(){ $('#modelLabel').textContent = model; }
updateLabel();

/* ---------- snow ---------- */
(function snow(){
  const c = document.getElementById('snow'), x = c.getContext('2d');
  let w, h, flakes = [];
  function resize(){
    w = c.width = innerWidth * devicePixelRatio;
    h = c.height = innerHeight * devicePixelRatio;
    flakes = Array.from({length: Math.min(90, Math.floor(innerWidth / 8))}, () => spawn(true));
  }
  function spawn(init){
    return {
      x: Math.random() * w,
      y: init ? Math.random() * h : -10,
      r: (Math.random() * 2.2 + 0.8) * devicePixelRatio,
      s: (Math.random() * 0.6 + 0.3) * devicePixelRatio,
      d: Math.random() * Math.PI * 2,
      a: Math.random() * 0.5 + 0.4
    };
  }
  function frame(){
    x.clearRect(0, 0, w, h);
    for (const f of flakes){
      f.d += 0.01;
      f.y += f.s;
      f.x += Math.sin(f.d) * 0.4 * devicePixelRatio;
      if (f.y > h + 10) Object.assign(f, spawn(false));
      x.globalAlpha = f.a;
      x.fillStyle = '#ffffff';
      x.beginPath();
      x.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      x.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  resize();
  frame();
})();

/* ---------- chat ---------- */
function addMsg(role, text, img){
  const empty = $('#emptyState');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (img){
    const i = document.createElement('img');
    i.src = img; i.alt = '';
    d.appendChild(i);
  }
  const t = document.createElement('div');
  t.textContent = text;
  d.appendChild(t);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function setTyping(el){
  el.classList.add('typing');
  el.querySelector('div').innerHTML = '<i></i><i></i><i></i>';
}

function compress(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('не удалось открыть картинку')); };
    img.src = url;
  });
}

$('#attach').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    pendingImage = await compress(f);
    $('#previewImg').src = pendingImage;
    $('#preview').style.display = 'flex';
  } catch (err) {
    const m = addMsg('error', 'Ошибка: ' + err.message);
    m.className = 'msg error';
  }
};
$('#removeImg').onclick = () => {
  pendingImage = null;
  $('#preview').style.display = 'none';
};

const input = $('#input');
function autosize(){
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
}
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

function setBusy(b){ $('#send').disabled = b; }

function stripOldImages(m){
  if (!Array.isArray(m.content)) return m;
  const text = m.content.filter(p => p.type === 'text').map(p => p.text).join('\n');
  return { role: m.role, content: text + ' [изображение]' };
}

function explainError(e, status){
  if (e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(e.message)){
    return 'Не удалось связаться с сервером API. Открой страницу в Chrome или по ссылке GitHub Pages (в режиме просмотра запросы блокируются), проверь интернет и адрес API в настройках.';
  }
  if (status === 401) return 'Ключ не принят. Проверь его в настройках.';
  if (status === 402) return 'Не хватает токенов или средств на ключе, либо модель недоступна. Проверь баланс и название модели.';
  if (status === 429) return 'Слишком много запросов или лимит бесплатной модели исчерпан. Подожди или выбери другую модель.';
  return e.message;
}

async function send(){
  const text = input.value.trim();
  if (!text && !pendingImage) return;
  if (!apiKey){
    openSettings();
    return;
  }

  const img = pendingImage;
  const content = img
    ? [{ type: 'text', text: text || 'Опиши, что на картинке' },
       { type: 'image_url', image_url: { url: img } }]
    : text;

  addMsg('user', text || '', img);
  history.push({ role: 'user', content });

  input.value = '';
  autosize();
  pendingImage = null;
  $('#preview').style.display = 'none';
  setBusy(true);

  const holder = addMsg('ai', '');
  setTyping(holder);

  let status = 0;
  try {
    const messages = [
      { role: 'system', content: SYSTEM },
      ...history.map((m, i) => i === history.length - 1 ? m : stripOldImages(m))
    ];
    const r = await fetch(apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
        'X-Title': 'MILOK'
      },
      body: JSON.stringify({ model, messages })
    });
    status = r.status;
    const data = await r.json();
    if (!r.ok) throw new Error(data?.error?.message || ('HTTP ' + r.status));
    const reply = data.choices?.[0]?.message?.content || '(пустой ответ)';
    history.push({ role: 'assistant', content: reply });
    holder.classList.remove('typing');
    holder.querySelector('div').textContent = reply;
  } catch (e) {
    history.pop();
    holder.className = 'msg error';
    holder.querySelector('div').textContent = 'Ошибка: ' + explainError(e, status);
  } finally {
    setBusy(false);
    chat.scrollTop = chat.scrollHeight;
  }
}
$('#send').onclick = send;

/* ---------- settings ---------- */
function openSettings(){
  $('#k').value = apiKey;
  $('#m').value = model;
  $('#u').value = apiUrl;
  $('#settings').classList.add('open');
}
$('#settingsBtn').onclick = openSettings;
$('#cancelBtn').onclick = () => $('#settings').classList.remove('open');
$('#saveBtn').onclick = () => {
  apiKey = $('#k').value.trim();
  model = $('#m').value.trim() || DEFAULT_MODEL;
  apiUrl = $('#u').value.trim() || DEFAULT_URL;
  store.set(URL_STORE, apiUrl);
  store.set(KEY_STORE, apiKey);
  store.set(MODEL_STORE, model);
  updateLabel();
  $('#settings').classList.remove('open');
};
$('#clearBtn').onclick = () => {
  history = [];
  chat.innerHTML = '';
  $('#settings').classList.remove('open');
  addMsg('ai', 'Чат очищен. Задай новый вопрос!');
};
$('#settings').onclick = e => {
  if (e.target.id === 'settings') $('#settings').classList.remove('open');
};

addMsg('ai', apiKey
  ? 'С Новым годом! Я MILOK. Напиши вопрос или прикрепи картинку.'
  : 'С Новым годом! Я MILOK. Чтобы начать, открой настройки (значок справа вверху) и вставь API-ключ, адрес и название модели.');
</script>
</body>
</html>
