  .logo { position: relative; width: 120px; height: 120px; animation: float 3.2s ease-in-out infinite; }

  small { display: block; margin-top: 8px; font-size: 15px; font-weight: 500; color: rgba(255,255,255,.55); }
  small i { display: inline-block; animation: dot 1.4s infinite; font-style: normal; }
  small i:nth-child(2) { animation-delay: .2s; } small i:nth-child(3) { animation-delay: .4s; }
  .c { max-width: 340px; font-size: 14.5px; font-weight: 500; color: rgba(255,255,255,.6); margin-top: -14px; }
  .g { margin-top: 6px; padding: 14px 26px; border: 0; border-radius: 999px; font: 700 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #000; background: #fff; cursor: pointer; box-shadow: 0 0 0 0 rgba(255,255,255,.5); animation: pulse 2.2s ease-in-out infinite; }
  .g:active { transform: scale(.96); }
  .g[hidden], .ok[hidden] { display: none; }
  .ok { max-width: 340px; padding: 16px 20px; border-radius: 22px; background: linear-gradient(135deg, #04140f, #0d2a3a); box-shadow: inset 0 0 0 1px rgba(80,230,200,.45), 0 0 30px rgba(57,243,200,.25); }
  .ok b { display: block; font-size: 16px; color: #dcfff6; }
  .ok small { margin-top: 6px; font-size: 13.5px; color: rgba(220,255,246,.7); }
  .ok.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
  @keyframes pop { from { opacity: 0; transform: scale(.8); } }
  @keyframes float { 50% { transform: translateY(-10px); } }
  @keyframes spin { 0%, 60% { transform: rotateY(0) scale(1); } 75% { transform: rotateY(180deg) scale(1.06); } 90%, 100% { transform: rotateY(360deg) scale(1); } }
  @keyframes glow { to { transform: rotate(360deg); } }
  @keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  @keyframes dot { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
