<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MKW Music</title>

<style>
html,body{margin:0;background:#000}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:26px;padding:48px 16px calc(28px + env(safe-area-inset-bottom));box-sizing:border-box;color:#fff;font:600 20px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;overflow-x:hidden}
.logo{position:relative;width:112px;height:112px;flex:none;animation:float 3.2s ease-in-out infinite}
.logo img{position:relative;z-index:1;width:100%;height:100%;border-radius:30px;display:block;animation:breathe 4s ease-in-out infinite}
.logo::before{content:'';position:absolute;inset:-14px;border-radius:44px;background:conic-gradient(from 0deg,#ff3b5c,#7a5cff,#39f3ff,#ff3b5c);filter:blur(24px);opacity:.5;animation:glow 4s linear infinite}
.logo::after{content:'';position:absolute;inset:-6px;border-radius:36px;border:2px solid rgba(255,255,255,.16);animation:ring 2.4s ease-out infinite}
p{margin:0}
#t small{display:block;margin-top:6px;font-size:15px;font-weight:500;color:rgba(255,255,255,.55)}
#t small i{display:inline-block;font-style:normal;animation:dot 1.4s infinite}
#t small i:nth-child(2){animation-delay:.2s}#t small i:nth-child(3){animation-delay:.4s}
.c{max-width:340px;font-size:14px;font-weight:500;color:rgba(255,255,255,.55);margin-top:-12px}
.box{width:min(400px,100%);text-align:left;border-radius:20px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);padding:14px 16px}
#sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
#sh b{font-size:14px}#sh span{font:500 11.5px ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.4)}
#st{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#st li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;position:relative}
#st li>i{flex:none;width:10px;height:10px;margin-top:5px;border-radius:50%;background:#222;box-shadow:inset 0 0 0 1.5px #444}
#st li.done>i{background:#2ee59d;box-shadow:0 0 8px rgba(46,229,157,.6)}
#st li.now>i{background:#ffb02e;box-shadow:0 0 0 0 rgba(255,176,46,.6);animation:now 1.6s infinite}
#st li div{flex:1;min-width:0}#st b{display:block;font-size:13.5px;font-weight:650}
#st small{display:block;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.42);line-height:1.35}
#st li.wait b{color:rgba(255,255,255,.45)}
#st em{flex:none;font:600 10.5px ui-monospace,Menlo,Consolas,monospace;font-style:normal;color:rgba(255,255,255,.35);margin-top:3px;text-transform:uppercase}
#st li.done em{color:#2ee59d}#st li.now em{color:#ffb02e}
#up{margin-top:8px;font:500 11px ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.3)}
.g{padding:14px 26px;border:0;border-radius:999px;font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000;background:#fff;cursor:pointer;animation:pulse 2.2s ease-in-out infinite}
.g:active{transform:scale(.96)}
[hidden]{display:none!important}
.ok{position:relative;width:min(400px,100%);box-sizing:border-box;padding:16px 44px 16px 18px;border-radius:20px;background:#000;box-shadow:inset 0 0 0 1px rgba(80,230,200,.45),0 0 26px rgba(57,243,200,.18);text-align:left}
.ok b{display:block;font-size:15px;color:#dcfff6}.ok small{display:block;margin-top:5px;font-size:13px;font-weight:500;color:rgba(220,255,246,.65)}
.ok.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
#hd{position:absolute;top:10px;right:10px;border:0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border-radius:999px;padding:5px 10px;font:600 12px system-ui,sans-serif;cursor:pointer}
#mini{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:#5ff5d2;font:600 13px system-ui,sans-serif;cursor:pointer;padding:4px 10px}
#mini i{font-style:normal}
#rd{width:min(400px,100%);text-align:left;font:500 11.5px ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.45)}
#rd b{display:flex;align-items:center;gap:8px;font:650 12.5px system-ui,sans-serif;color:rgba(255,255,255,.75);margin-bottom:7px}
#rd b::before{content:'';width:7px;height:7px;border-radius:50%;background:#39f3ff;box-shadow:0 0 8px #39f3ff;animation:blink 1s infinite}
.bar{height:4px;border-radius:4px;background:#111;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#7a5cff,#39f3ff);transition:width .8s ease}
.rw{display:flex;justify-content:space-between;margin-top:6px}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes glow{to{transform:rotate(360deg)}}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.35);opacity:0}}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes now{70%{box-shadow:0 0 0 7px rgba(255,176,46,0)}}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
