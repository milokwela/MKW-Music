# Автоматическая сборка Android-приложения MKW Music (beta) — APK кладётся в релиз «android-beta».
# Запускается сама, когда меняется папка android/ (или этот файл) в main, и вручную:
#   Actions → Android APK → Run workflow.
# Приложение — оболочка вокруг https://mkwmusic.ru, поэтому обновления сайта пересобирать APK не требуют.
# Версия приложения — в файле android/version.txt (поднимайте её, когда меняете оболочку).
#
# Подпись (необязательно, но тогда новые версии ставятся поверх старой без удаления).
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   MKW_KEYSTORE_BASE64   — файл ключа .jks, закодированный в base64
#   MKW_KEYSTORE_PASSWORD — пароль от файла ключа
#   MKW_KEY_ALIAS         — имя ключа внутри файла
#   MKW_KEY_PASSWORD      — пароль ключа (если пустой, берётся пароль файла)
# Если секретов нет, сборка подписывается одноразовым ключом: APK работает, но обновить поверх
# уже установленной версии не получится — её придётся удалить.
name: Android APK

on:
  push:
    branches: [main, 'apk/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Версия
        id: ver
        run: |
          V=$(tr -d '[:space:]' < android/version.txt)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "Версия приложения: $V, сборка #${{ github.run_number }}"

      - name: Ключ подписи
        id: key
        env:
          KS_B64: ${{ secrets.MKW_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MKW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MKW_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MKW_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/mkw.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            KP="${KEY_PASS:-$KS_PASS}"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Подпись: постоянный ключ из секретов"
          else
            KS_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$KS_PASS"
            KEY_ALIAS=mkw
            KP="$KS_PASS"
            keytool -genkeypair -keystore "$KS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KP" \
              -dname "CN=MKW Music beta, O=MKW Music" >/dev/null
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Подпись: одноразовый ключ этой сборки (секретов нет)"
          fi
          {
            echo "MKW_KEYSTORE_FILE=$KS"
            echo "MKW_KEYSTORE_PASSWORD=$KS_PASS"
            echo "MKW_KEY_ALIAS=$KEY_ALIAS"
            echo "MKW_KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"

      - name: Собрать APK
        shell: bash
        working-directory: android
        env:
          MKW_VERSION_NAME: ${{ steps.ver.outputs.name }}
          MKW_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Проверить APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|uses-permission|sdkVersion|targetSdkVersion|application-label:)" || true

      - name: Подготовить файлы
        id: pack
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MKW-Music-beta.apk
          (cd dist && sha256sum MKW-Music-beta.apk > MKW-Music-beta.apk.sha256)
          SHA=$(cut -d' ' -f1 dist/MKW-Music-beta.apk.sha256)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.key.outputs.stable }}" = "true" ]; then
            SIGN="постоянный ключ: новые версии ставятся поверх старой"
          else
            SIGN="одноразовый ключ этой сборки: если Android не ставит поверх старой версии, удалите её и установите заново"
          fi
          cat > dist/notes.md <<EOF
          **MKW Music для Android — beta (сырая версия).** Сайт mkwmusic.ru по-прежнему удобнее; приложение мы ещё развиваем.

          - Версия приложения: ${{ steps.ver.outputs.name }} · сборка #${{ github.run_number }} · коммит ${GITHUB_SHA::7}
          - SHA-256: \`$SHA\`
          - Подпись: $SIGN

          **Как скачать безопасно:** берите файл только отсюда или с mkwmusic.ru (Профиль → О MKW), там же подробная инструкция. Приложению нужен только интернет; камера и микрофон спросят разрешение в момент использования.
          EOF
          {
            echo "### MKW Music для Android"
            echo "Версия приложения ${{ steps.ver.outputs.name }}, сборка #${{ github.run_number }}"
            echo ""
            echo "SHA-256: \`$SHA\`"
            echo ""
            echo "Подпись: $SIGN"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MKW-Music-beta-apk
          path: |
            dist/MKW-Music-beta.apk
            dist/MKW-Music-beta.apk.sha256
          retention-days: 30

      - name: Выложить в релиз android-beta
        run: |
          gh release delete android-beta --cleanup-tag --yes || true
          gh release create android-beta \
            dist/MKW-Music-beta.apk dist/MKW-Music-beta.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "MKW Music для Android — beta" \
            --notes-file dist/notes.md \
            --latest

      - name: Хвост лога при ошибке
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          M=$( { grep -E -B1 -A8 "What went wrong|error:|Execution failed|FAILED" "$LOG" | head -n 60; echo '-----'; tail -n 25 "$LOG"; } \
            | python3 -c "import sys;t=sys.stdin.read();print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Gradle::$M"
