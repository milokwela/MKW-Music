# Не даёт GitHub удалить кэш с ключом подписи Android-приложения (кэш, к которому не обращались 7 дней, удаляется).
# Если ключ пропадёт, новые версии APK придётся ставить, предварительно удалив старую. Подробнее — в android.yml.
name: Android key keepalive

on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.mkw-signing
          key: mkw-android-signing-v1
      - name: Результат
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then echo "Ключ подписи в кэше есть"; else echo "Ключа в кэше нет (появится при следующей сборке в main)"; fi
