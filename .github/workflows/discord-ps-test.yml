# Проверка помощника MKW Discord (ds.ps1) на настоящем Windows: поддельный Discord + запросы как от сайта.
name: MKW Discord script test

on:
  push:
    branches: [main]
    paths: ['ds.ps1', 'discord/ds.ps1', 'discord/test-ds.ps1', '.github/workflows/discord-ps-test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Поддельный Discord + помощник + запросы сайта
        shell: powershell
        env:
          MKW_MODE: ${{ github.event_name }}
        run: |
          iex ([IO.File]::ReadAllText("$PWD\discord\test-ds.ps1", [Text.Encoding]::UTF8))
