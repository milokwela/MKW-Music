# Автоматическая выкладка «серверной» части MKW Music:
#  • правила Firestore (firestore.rules) — в Firebase
#  • Cloudflare Worker (docs/recognize-worker.js) — в Cloudflare
# Запускается сама, когда эти файлы меняются в main, и вручную (Actions → Deploy backend → Run workflow).
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — JSON-ключ сервисного аккаунта Firebase
#   CLOUDFLARE_API_TOKEN     — токен Cloudflare с правом «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID    — ID аккаунта Cloudflare
# Если секрета нет, соответствующий шаг просто пропускается.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'docs/recognize-worker.js', 'deploy/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить секрет
        id: chk
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Нет FIREBASE_SERVICE_ACCOUNT — пропускаю"; fi
      - name: Выложить правила Firestore
        if: steps.chk.outputs.ok == '1'
        working-directory: deploy
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project mkw-music --non-interactive

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить секрет
        id: chk
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: if [ -n "$T" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Нет CLOUDFLARE_API_TOKEN — пропускаю"; fi
      - name: Выложить Cloudflare Worker
        if: steps.chk.outputs.ok == '1'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
        run: npx --yes wrangler@3 deploy
