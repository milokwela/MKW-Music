<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
/* лёгкая заставка: только прозрачность и масштаб (их рисует видеокарта), без размытий и частиц */
#w{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(150,120,255,.28),rgba(255,120,190,.12) 55%,transparent);opacity:0;animation:g 1.6s ease-out .1s forwards}
#logo{position:relative;width:46vmin;max-width:230px;opacity:0;transform:scale(.86);animation:l .9s cubic-bezier(.2,.8,.2,1) .05s forwards;will-change:transform,opacity}
#t{position:relative;font:800 26px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.32em;padding-left:.32em;color:#fff;opacity:0;transform:translateY(8px);animation:t .7s ease-out .45s forwards}
#by{position:absolute;bottom:42px;left:0;right:0;text-align:center;font:500 12px/1.5 system-ui,Roboto,sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.55);opacity:0;animation:t .7s ease-out .8s forwards}
#by b{display:block;font-weight:700;letter-spacing:.06em;font-size:15px;color:rgba(255,255,255,.9)}
@keyframes l{to{opacity:1;transform:none}}
@keyframes g{to{opacity:1}}
@keyframes t{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#logo,#t,#by,#glow{animation-duration:.01s}}
